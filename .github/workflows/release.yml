name: Release

# HOW TO RELEASE
#   Actions tab -> "Release" (left sidebar) -> "Run workflow" button -> Run workflow.
#   Leave the version box empty and it picks the next one for you.
#
# What it does: builds the Windows app, stamps the version into the exe and the
# About dialog, and publishes a GitHub Release (which tags the commit) with the
# zipped app attached. If a run fails, just run it again. Share https://github.com/spolwort1970/dw-workbench/releases/latest
# — it always points at the newest release.
#
# Pushing a v* tag by hand also works, if you ever prefer that.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to auto-number, e.g. 1.0.4)'
        required: false
        default: ''
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0   # need full history so tags are visible

    - name: Work out the version
      id: ver
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME#v}"        # tag push: use the tag
        elif [ -n "${INPUT_VERSION}" ]; then
          VERSION="${INPUT_VERSION#v}"          # typed into the box
        else
          VERSION="1.0.${GITHUB_RUN_NUMBER}"    # nothing given: auto-number
        fi
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Version must look like 1.2.3 (got '$VERSION')."
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}"    >> "$GITHUB_OUTPUT"
        echo "Releasing v${VERSION}"

    - name: Stop if this version is already released
      if: github.ref_type != 'tag'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.ver.outputs.tag }}"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists — stopping so nothing is overwritten."
          exit 1
        fi
        # A tag with no release is left over from a failed run. Reuse it only if it
        # marks this same commit; otherwise stop rather than release the wrong code.
        if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
          if [ "$(git rev-list -n 1 "$TAG")" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG already exists on a different commit — pick another version."
            exit 1
          fi
          echo "Reusing tag $TAG from an earlier failed run (same commit)."
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      working-directory: frontend
      env:
        DW_VERSION: ${{ steps.ver.outputs.version }}   # shown in the About dialog
      run: npm run build

    - name: Install backend dependencies
      working-directory: backend
      run: pip install -r requirements.txt pyinstaller

    - name: Build backend
      working-directory: backend
      run: python -m PyInstaller --noconfirm server.spec

    - name: Install Electron dependencies
      working-directory: electron
      run: npm ci

    - name: Package app
      working-directory: electron
      run: >
        npx electron-packager . "DW Workbench" --platform win32 --arch x64 --out dist --overwrite
        --extra-resource ../backend/dist/server --icon icon.ico
        --app-version ${{ steps.ver.outputs.version }} --build-version ${{ steps.ver.outputs.version }}

    - name: Zip the app
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        Compress-Archive -Path 'electron/dist/DW Workbench-win32-x64' `
          -DestinationPath 'DW-Workbench-win32-x64.zip' -Force

    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat > release-notes.md <<'NOTES'
        ## Install (Windows 10/11, x64)

        1. Download **DW-Workbench-win32-x64.zip** below (not "Source code") and extract it anywhere.
        2. Open the extracted **DW Workbench-win32-x64** folder and run **DW Workbench.exe**.
        3. On first launch the app downloads the DataWeave CLI (needs internet access to github.com).

        The app isn't code-signed yet, so Windows SmartScreen may warn on first run — click **More info → Run anyway**.

        Optional extras: Max (the AI assistant) needs the Claude Code CLI or an Anthropic API key; the Secure Properties tab needs Java 17+ and the MuleSoft Secure Properties JAR. See the [README](https://github.com/spolwort1970/dw-workbench#readme) for setup.
        NOTES
        # gh creates the tag on this commit as part of the release, so a failed run
        # never leaves a tag behind. GitHub's API occasionally answers 5xx, so retry.
        TAG="${{ steps.ver.outputs.tag }}"
        ZIP="DW-Workbench-win32-x64.zip"
        for attempt in 1 2 3 4; do
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true   # drop a half-made draft; keeps the tag
          if gh release create "$TAG" "$ZIP" \
               --target "$GITHUB_SHA" \
               --title "DW Workbench ${TAG}" \
               --notes-file release-notes.md \
               --generate-notes; then
            exit 0
          fi
          echo "Attempt $attempt failed; retrying in $((attempt * 20))s…"
          sleep $((attempt * 20))
        done
        echo "Could not create the release after 4 attempts."
        exit 1
