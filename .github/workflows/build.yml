name: Build DW Workbench

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Install backend dependencies
      working-directory: backend
      run: pip install -r requirements.txt pyinstaller

    - name: Build backend
      working-directory: backend
      run: python -m PyInstaller --noconfirm server.spec

    - name: Install Electron dependencies
      working-directory: electron
      run: npm ci

    - name: Package app
      working-directory: electron
      run: npx electron-packager . "DW Workbench" --platform win32 --arch x64 --out dist --overwrite --extra-resource ../backend/dist/server --icon icon.ico

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: DW-Workbench-Windows
        path: electron/dist/DW Workbench-win32-x64/
